<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Overview · Zod</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="overview" data-mode="stream">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="page">
        <div class="stats-grid" id="stats"></div>

        <div class="overview-grid">
          <section class="card panel">
            <div class="card-head">
              <div>
                <h2 class="card-title">Pipeline</h2>
                <p class="card-sub">Every candidate between discovery and Discord.</p>
              </div>
              <a class="text-link" href="/flow">Open flow →</a>
            </div>
            <div class="stage-strip" id="stage-strip"></div>
          </section>

          <section class="card panel">
            <div class="card-head">
              <div>
                <h2 class="card-title">Live slots</h2>
                <p class="card-sub">Models currently on duty.</p>
              </div>
              <span class="pill" id="slot-count">0</span>
            </div>
            <div class="slot-list" id="slot-list"></div>
          </section>
        </div>

        <section class="card panel">
          <div class="card-head">
            <div>
              <h2 class="card-title">Recent tool calls</h2>
              <p class="card-sub">Fetch, sanitize, audit, route — the last few things the machine did.</p>
            </div>
            <a class="text-link" href="/glass">Open glass →</a>
          </div>
          <div class="feed feed-compact" id="recent-feed"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="/assets/icons.js"></script>
  <script src="/assets/shell.js"></script>
  <script src="/assets/api.js"></script>
  <script src="/assets/sse.js"></script>
  <script>
    (function () {
      'use strict';
      const UI = window.ZodUI;
      const Api = window.ZodApi;
      const icon = UI.icon;

      const statsEl = document.getElementById('stats');
      const stageEl = document.getElementById('stage-strip');
      const slotsEl = document.getElementById('slot-list');
      const slotCountEl = document.getElementById('slot-count');
      const feedEl = document.getElementById('recent-feed');

      let overview = null;
      let slots = [];
      let events = [];
      let loading = true;
      let loadError = '';

      const TINTS = {
        groq: ['#efeaff', '#5b44c9'],
        cerebras: ['#fff0e6', '#d1783a'],
        'github-models': ['#eaf2ff', '#3f78c4'],
        sambanova: ['#e8f8f1', '#2d9770'],
        mistral: ['#fdeaf2', '#c4557f'],
        openrouter: ['#fff4e2', '#b87818'],
        local: ['#f2eff8', '#8c86a3'],
      };

      function tintFor(provider) {
        return TINTS[String(provider || '').toLowerCase()] || ['#efeaff', '#5b44c9'];
      }

      function initials(value) {
        const parts = String(value || 'zod').split(/[^a-zA-Z0-9]+/).filter(Boolean);
        return (parts[0] || 'z')[0].toUpperCase() + ((parts[1] || '')[0] || '').toUpperCase();
      }

      function renderStats() {
        if (loading && !overview) {
          statsEl.innerHTML = UI.loadingState('Reading pipeline state…');
          return;
        }
        if (loadError && !overview) {
          statsEl.innerHTML = UI.errorState('Overview unavailable', loadError);
          return;
        }
        const counts = (overview && overview.counts) || {};
        const stats = (overview && overview.stats) || {};
        const activeAgents = Math.max(Number(stats.activeAgents || 0), slots.length);
        const inFlight = Number(counts.fetching || 0) + Number(counts.auditing || 0) + Number(counts.routing || 0);
        const cards = [
          {
            tint: 'tint-lav',
            icon: 'activity',
            value: UI.fmtNumber(activeAgents),
            label: 'Active agents',
            sub: 'seen in the last 10 minutes',
            note: 'live',
          },
          {
            tint: 'tint-sky',
            icon: 'zap',
            value: UI.fmtNumber(stats.recentCalls || 0),
            label: 'Tool calls',
            sub: 'retained in the 24h ring',
            note: '24h',
          },
          {
            tint: 'tint-peach',
            icon: 'inbox',
            value: UI.fmtNumber(inFlight),
            label: 'In flight',
            sub: 'fetching · auditing · routing',
            note: 'now',
          },
          {
            tint: 'tint-mint',
            icon: 'send',
            value: UI.fmtNumber(stats.deliveredToday || 0),
            label: 'Delivered today',
            sub: 'routed to a Discord channel',
            note: 'today',
          },
          {
            tint: 'tint-pink',
            icon: 'shuffle',
            value: UI.fmtNumber(stats.batonPasses || 0),
            label: 'Baton passes',
            sub: '429 / 413 fallback in the ring',
            note: 'ring',
          },
        ];
        statsEl.innerHTML = cards
          .map(
            (card) =>
              '<article class="stat-card ' +
              card.tint +
              '">' +
              '<div class="stat-top"><span class="stat-icon">' +
              icon(card.icon, 17) +
              '</span><span class="stat-note">' +
              card.note +
              '</span></div>' +
              '<div class="stat-value">' +
              card.value +
              '</div>' +
              '<div class="stat-label">' +
              card.label +
              '</div>' +
              '<div class="stat-sub">' +
              card.sub +
              '</div>' +
              '</article>',
          )
          .join('');
      }

      function renderStages() {
        const counts = (overview && overview.counts) || {};
        stageEl.innerHTML = UI.stages
          .map(
            (stage) =>
              '<a class="stage-cell" href="/flow" style="--stage-soft:' +
              stage.soft +
              ';--stage-color:' +
              stage.color +
              '">' +
              '<strong>' +
              UI.fmtNumber(counts[stage.key] || 0) +
              '</strong>' +
              '<div class="stage-name">' +
              stage.label +
              '</div>' +
              '<div class="stage-hint">' +
              stage.hint +
              '</div>' +
              '</a>',
          )
          .join('');
      }

      function renderSlots() {
        slotCountEl.textContent = String(slots.length);
        if (!slots.length) {
          slotsEl.innerHTML = UI.emptyState('No active slots', 'Telemetry will fill this in as workers start.', 'activity');
          return;
        }
        slotsEl.innerHTML = slots
          .slice(0, 10)
          .map((slot) => {
            const tint = tintFor(slot.provider);
            const status = String(slot.status || '');
            return (
              '<div class="mini-slot">' +
              '<span class="slot-avatar" style="--slot-tint:' +
              tint[0] +
              ';--slot-color:' +
              tint[1] +
              '">' +
              UI.esc(initials(slot.agent || slot.provider)) +
              '</span>' +
              '<div style="min-width:0">' +
              '<div class="mini-slot-name">' +
              UI.esc(slot.agent || slot.provider || 'worker') +
              '</div>' +
              '<div class="mini-slot-meta">' +
              UI.esc([slot.provider, slot.model].filter(Boolean).join(' · ') || '—') +
              (slot.currentTool ? ' · ' + UI.esc(slot.currentTool) : '') +
              '</div>' +
              '</div>' +
              '<span class="pill ' +
              UI.pillClass(status) +
              '">' +
              UI.esc(UI.statusLabel(status)) +
              '</span>' +
              '</div>'
            );
          })
          .join('');
      }

      function mergeEvents(incoming) {
        const byId = new Map();
        for (const event of events) byId.set(event.id || event.created + event.tool, event);
        for (const event of incoming) byId.set(event.id || event.created + event.tool, event);
        events = [...byId.values()]
          .sort((a, b) => Date.parse(b.created) - Date.parse(a.created))
          .slice(0, 8);
      }

      function renderEvents() {
        if (!events.length) {
          feedEl.innerHTML = UI.emptyState('No calls yet', 'The machine event ring is empty.', 'terminal');
          return;
        }
        feedEl.innerHTML = events.map((event) => UI.eventRow(event, { compact: true })).join('');
      }

      async function refresh() {
        try {
          const data = await Api.overview();
          overview = data;
          loading = false;
          loadError = '';
          renderStats();
          renderStages();
          const recent = await Api.events({ limit: 8 });
          mergeEvents(recent.events || []);
          renderEvents();
        } catch (error) {
          loading = false;
          loadError = error.message || String(error);
          renderStats();
          if (!events.length) renderEvents();
        }
      }

      function onStatus(state) {
        if (state.state === 'connected') {
          UI.setLive('connected', 'Live stream');
          UI.setStale(false);
        } else if (state.state === 'stale') {
          UI.setLive('stale', 'Stream stale');
          UI.setStale(true);
        } else if (state.state === 'reconnecting') {
          UI.setLive('reconnecting', 'Reconnecting…');
        } else if (state.state === 'connecting') {
          UI.setLive('connecting', 'Connecting…');
        }
      }

      statsEl.innerHTML = UI.loadingState('Reading pipeline state…');
      stageEl.innerHTML = UI.loadingState('Loading stages…');
      slotsEl.innerHTML = UI.loadingState('Waiting for telemetry…');
      renderEvents();

      UI.poll(refresh, 15_000);

      window.ZodSSE.connect({
        onDelta: function (data) {
          if (Array.isArray(data.slots)) {
            slots = data.slots;
            renderStats();
            renderSlots();
          }
          if (Array.isArray(data.events) && data.events.length) {
            mergeEvents(data.events);
            renderEvents();
          }
        },
        onStatus,
      });
    })();
  </script>
</body>
</html>
